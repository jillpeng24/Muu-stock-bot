name: 自動補齊歷史基本面資料庫

on:
  workflow_dispatch:
  schedule:
    # 1. 第一波：每月 12 日，晚上 8 點開始（主攻：月營收）
    - cron: '0 12-21 12 * *'
    
    # 2. 第二波：每月 16 日，晚上 8 點開始（主攻：季報 EPS 補漏）
    - cron: '0 12-21 16 * *'

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 取得最新程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. 安裝必備套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 執行基本面歷史資料抓取 (斷點續傳)
      env:
        FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      run: python -u update_history_cloudauto.py

    - name: 5. 存檔並推回雲端資料夾
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/history/*.csv || true
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 自動更新歷史基本面資料庫"
        git push
