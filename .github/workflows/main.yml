name: Stock Auto Runner

on:
  schedule:
    # 台北時間 14:32（收盤後），UTC 06:32，僅週一至週五
    - cron: '32 6 * * 1-5'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  stock_analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Auto Sequence
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python autorun.py

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 🌟 關鍵修改：使用 -A 追蹤所有變動（包含新增與刪除）
          git add -A data/
          
          git commit -m "Auto-update and cleanup stock results $(date +'%Y-%m-%d')" || exit 0
          git pull origin main --no-rebase -X ours
          git push
