name: Stock Bot Daily Run

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4 # 升級到 v4

      - name: 設定 Python
        uses: actions/setup-python@v5 # 升級到 v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 安裝套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 執行搜股排程
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "📂 檢查檔案列表："
          ls -la
          
          echo "🚀 啟動 Python 腳本..."
          # 使用 python3 -u 確保日誌即時輸出，若失敗則強制報錯
          python3 -u autorun.py || { echo "❌ 執行失敗"; exit 1; }
          
          echo "📊 檢查產出檔案："
          mkdir -p data
          ls -lh data/
      
      - name: 累積資料並存回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p data
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/*.csv
            git commit -m "🤖 自動更新股票資料 [skip ci]"
            git push origin main
          else
            echo "ℹ️ 無變更需要提交"
          fi
      
      - name: 上傳結果檔案 (Artifacts)
        uses: actions/upload-artifact@v4 # 關鍵修正：必須使用 v4
        if: always()
        with:
          name: stock-analysis-results
          path: data/*.csv
          retention-days: 7
