name: Stock Bot Daily Run

on:
  schedule:
    # 台灣時間週一至週五 下午 16:30 執行 (UTC 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 允許你手動點擊執行測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 給予寫入權限，才能把資料累積回 GitHub
    permissions:
      contents: write
      
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行搜股排程
        env:
          # 這裡對應我們稍後要在 GitHub 設定的 Secrets
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python autorun.py

      - name: 累積資料並存回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.csv
          git commit -m "Update stock data [skip ci]" || exit 0
          git push
